# golangci-lint v2. Version pinned in tools/go.mod; run via ./tools/task.ps1 lint.
# Every rule that encodes a guardrail says so (STANDARDS.md#guardrails).
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - contextcheck   # I/O functions take and pass on a context
    - depguard       # banned packages, see settings
    - errname        # ErrX sentinels, XError types
    - errorlint      # errors.Is/As, %w wrapping
    - exhaustive     # switches over enums cover every case
    - forbidigo      # guardrails, see settings
    - gocritic
    - gosec          # security
    - misspell
    - noctx          # network calls carry a context
    - nolintlint     # every //nolint names the linter and says why
    - revive         # Go style (naming, doc comments)
    - sloglint       # consistent log/slog calls
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    forbidigo:
      forbid:
        # stdout is the MCP protocol of every server using the kit.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: "stdout carries the MCP protocol; log with log/slog to stderr"
    depguard:
      rules:
        main:
          deny:
            - pkg: "io/ioutil"
              desc: "deprecated: use io and os"
            - pkg: "log$"
              desc: "use log/slog (to stderr)"
            - pkg: "github.com/pkg/errors"
              desc: "use the standard errors package and fmt.Errorf with %w"
        # Guardrail: the kit never reaches the network (docs/dependency-rules.md).
        network:
          files:
            - "$all"
          deny:
            - pkg: "net/http"
              desc: "mcp-kit never reaches the network: network code stays in the server (docs/dependency-rules.md)"
            - pkg: "net$"
              desc: "mcp-kit never reaches the network: network code stays in the server (docs/dependency-rules.md)"
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: context-as-argument
        - name: unused-parameter
    sloglint:
      no-mixed-args: true
      static-msg: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dvalfrid/mcp-kit
